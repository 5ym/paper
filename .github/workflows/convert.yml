name: qd to pdf

on:
  push:
    branches:
      - master

env:
  QUARKDOWN_MAJOR: 2

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: git config and fetch branch
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Action"
          git config --global core.quotepath false
          git fetch --no-tags --prune --depth=1
      - name: check branch exists and init and remove file and check modify
        id: check
        continue-on-error: true
        run: |
          (git checkout pdf && git fetch --unshallow origin pdf) || \
            (git checkout --orphan pdf && \
            git rm -rf . && echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904 > convertdone.txt && \
            git add . && git commit -m "first commit")
          set -o pipefail
          git diff --name-only --diff-filter=D `git show pdf:convertdone.txt` master | grep -E '\.(qd|md)$' | grep -v '\(^\|/\)_' | grep -v '\(^\|/\)README\.md$' | sed 's/\.[^.]*$//' | { while read -r f; do rm -f "$f.pdf"; done; } && \
          git add . && git commit -m "remove"
          git diff --name-only --diff-filter=MAR `git show pdf:convertdone.txt` master | grep -E '\.(qd|md)$' | grep -v '\(^\|/\)_' | grep -v '\(^\|/\)README\.md$' >> modified.txt && \
          echo "status=success" >> $GITHUB_OUTPUT
      - name: resolve quarkdown version
        id: quarkdown
        if: steps.check.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/iamgio/quarkdown/releases?per_page=100" \
            --jq "map(select(.draft == false and .prerelease == false and (.tag_name | startswith(\"v$QUARKDOWN_MAJOR.\")))) | .[0].tag_name")
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "quarkdown v$QUARKDOWN_MAJOR.x のリリースが見つかりません" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> $GITHUB_OUTPUT
      - name: cache quarkdown
        id: quarkdown-cache
        if: steps.check.outputs.status == 'success'
        uses: actions/cache@v4
        with:
          # 本体(JRE同梱)・puppeteer・Chromeが全てこの下に入る
          path: ${{ runner.tool_cache }}/quarkdown
          key: quarkdown-${{ runner.os }}-${{ steps.quarkdown.outputs.version }}
      - name: install quarkdown
        if: steps.check.outputs.status == 'success' && steps.quarkdown-cache.outputs.cache-hit != 'true'
        uses: quarkdown-labs/setup-quarkdown@v1
        with:
          quarkdown-version: ${{ steps.quarkdown.outputs.version }}
      - name: use cached quarkdown
        if: steps.check.outputs.status == 'success' && steps.quarkdown-cache.outputs.cache-hit == 'true'
        run: |
          # setup-quarkdownが作る/usr/local/binのラッパーはキャッシュ対象外なので同じ環境変数を張り直す
          echo "$RUNNER_TOOL_CACHE/quarkdown/bin" >> $GITHUB_PATH
          echo "QD_NPM_PREFIX=$RUNNER_TOOL_CACHE/quarkdown/lib" >> $GITHUB_ENV
          echo "PUPPETEER_CACHE_DIR=$RUNNER_TOOL_CACHE/quarkdown/lib/puppeteer_cache" >> $GITHUB_ENV
      - name: convert
        if: steps.check.outputs.status == 'success'
        env:
          # ubuntuランナーではAppArmorによりChromeのsandboxが使えない
          QUARKDOWN_EXTRA_OPTS: --pdf-no-sandbox
        run: |
          git checkout master
          git checkout -b tmp
          while read -r f; do sh ./build.sh "$f"; done < modified.txt
          git add . && git commit -m "tmp"
          git checkout pdf
          git show tmp:modified.txt | sed 's/\.[^.]*$//' | xargs -i git checkout tmp {}.pdf
          echo $GITHUB_SHA > convertdone.txt
          git add . && git commit -m "convert"
      - name: push
        run: git push origin HEAD
