name: qd to pdf

on:
  push:
    branches:
      - master

env:
  QUARKDOWN_IMAGE: ghcr.io/iamgio/quarkdown:2

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: git config and fetch branch
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Action"
          git config --global core.quotepath false
          git fetch --no-tags --prune --depth=1
      - name: check branch exists and init and remove file and check modify
        id: check
        continue-on-error: true
        run: |
          (git checkout pdf && git fetch --unshallow origin pdf) || \
            (git checkout --orphan pdf && \
            git rm -rf . && echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904 > convertdone.txt && \
            git add . && git commit -m "first commit")
          set -o pipefail
          git diff --name-only --diff-filter=D `git show pdf:convertdone.txt` master | grep -E '\.(qd|md)$' | grep -v '\(^\|/\)_' | sed 's/\.[^.]*$//' | { while read -r f; do rm -f "$f.pdf"; done; } && \
          git add . && git commit -m "remove"
          git diff --name-only --diff-filter=MAR `git show pdf:convertdone.txt` master | grep -E '\.(qd|md)$' | grep -v '\(^\|/\)_' >> modified.txt && \
          echo "status=success" >> $GITHUB_OUTPUT
      - name: convert
        if: steps.check.outputs.status == 'success'
        run: |
          git checkout master
          git checkout -b tmp
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/data" -w /data --entrypoint sh $QUARKDOWN_IMAGE \
            -c 'set -e; while read -r f; do sh ./build.sh "$f"; done < modified.txt'
          git add . && git commit -m "tmp"
          git checkout pdf
          git show tmp:modified.txt | sed 's/\.[^.]*$//' | xargs -i git checkout tmp {}.pdf
          echo $GITHUB_SHA > convertdone.txt
          git add . && git commit -m "convert"
      - name: push
        run: git push origin HEAD
