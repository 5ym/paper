name: seisho (Quarkdown to PDF)
description: 清書。リポジトリ内の .qd を Quarkdown で PDF にし、同じブランチの pdf フォルダ (と、指定すれば OneDrive などの rclone の送り先) へ置く
author: 5ym
branding:
  icon: file-text
  color: gray-dark

inputs:
  output-dir:
    description: PDF を置くフォルダ。.qd と同じフォルダ構造でこの下に置く
    required: false
    default: pdf
  default-setup:
    description: 既定の設定 (この Action の _setup.qd。A4・日本語フォントなど) を各文書の先頭に足す。文書の中で同じ関数を呼べば上書きできる
    required: false
    default: "true"
  rclone-config:
    description: rclone.conf の中身 (secrets から渡す)。rclone-remote と一緒に指定すると、そこへも PDF を送る
    required: false
    default: ""
  rclone-remote:
    description: PDF を送る rclone の送り先 (例 onedrive:Documents/report)。output-dir と同じフォルダ構造で置く
    required: false
    default: ""
  quarkdown-major:
    description: 使う Quarkdown のメジャーバージョン。その系列の最新リリースを使う
    required: false
    default: "2"
  token:
    description: Quarkdown のリリースを調べるための GitHub のトークン
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: list changed .qd
      id: list
      shell: bash
      env:
        OUT: ${{ inputs.output-dir }}
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git config --global core.quotepath false
        # 前回からの差分を取るので履歴が要る
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --quiet --unshallow origin
        fi
        OUT=${OUT%/}
        head=$(git rev-parse HEAD)
        # 前回変換したコミット。無ければ (初回・フォルダを消したとき) 空のツリーから = 全部
        base=$(cat "$OUT/.seisho" 2> /dev/null || true)
        git cat-file -e "$base^{commit}" 2> /dev/null || base=4b825dc642cb6eb9a060e54bf8d69288fbee4904
        # リネームは削除 + 追加として扱い、旧名の PDF も消す。
        # _ で始まるファイル (.include で読む分割用) と出力先の中は対象外
        list() {
          git diff --no-renames --name-only --diff-filter="$1" "$base" "$head" |
            grep -E '\.qd$' | grep -v '\(^\|/\)_' | grep -v "^$OUT/" || true
        }
        list D > "$RUNNER_TEMP/seisho-deleted.txt"
        list AM > "$RUNNER_TEMP/seisho-modified.txt"
        echo "head=$head" >> "$GITHUB_OUTPUT"
        echo "out=$OUT" >> "$GITHUB_OUTPUT"
        [ -s "$RUNNER_TEMP/seisho-modified.txt" ] && echo "convert=true" >> "$GITHUB_OUTPUT"
        if [ -s "$RUNNER_TEMP/seisho-modified.txt" ] || [ -s "$RUNNER_TEMP/seisho-deleted.txt" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
    - name: resolve quarkdown version
      id: quarkdown
      if: steps.list.outputs.convert == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        MAJOR: ${{ inputs.quarkdown-major }}
      run: |
        tag=$(gh api "repos/iamgio/quarkdown/releases?per_page=100" \
          --jq "map(select(.draft == false and .prerelease == false and (.tag_name | startswith(\"v$MAJOR.\")))) | .[0].tag_name")
        if [ -z "$tag" ] || [ "$tag" = "null" ]; then
          echo "quarkdown v$MAJOR.x のリリースが見つかりません" >&2
          exit 1
        fi
        echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
    - name: cache quarkdown
      id: quarkdown-cache
      if: steps.list.outputs.convert == 'true'
      uses: actions/cache@v6
      with:
        # 本体 (JRE 同梱) と chrome-headless-shell が全てこの下に入る
        path: ${{ runner.tool_cache }}/quarkdown
        key: quarkdown-${{ runner.os }}-${{ steps.quarkdown.outputs.version }}
    - name: install quarkdown
      if: steps.list.outputs.convert == 'true' && steps.quarkdown-cache.outputs.cache-hit != 'true'
      uses: quarkdown-labs/setup-quarkdown@v1
      with:
        quarkdown-version: ${{ steps.quarkdown.outputs.version }}
    - name: use cached quarkdown
      if: steps.list.outputs.convert == 'true' && steps.quarkdown-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        # setup-quarkdown が作る /usr/local/bin のラッパーはキャッシュされないので、
        # ラッパーが設定する環境変数を張り直す (2.6 以降は Chrome の場所を QD_CHROME_PATH で渡す)
        dir="$RUNNER_TOOL_CACHE/quarkdown"
        echo "$dir/bin" >> "$GITHUB_PATH"
        chrome=$(find "$dir/lib" -type f -name chrome-headless-shell -perm -u+x 2> /dev/null | head -n 1)
        if [ -n "$chrome" ]; then
          echo "QD_CHROME_PATH=$chrome" >> "$GITHUB_ENV"
        fi
    - name: convert
      if: steps.list.outputs.changed == 'true'
      shell: bash
      env:
        OUT: ${{ steps.list.outputs.out }}
        HEAD_SHA: ${{ steps.list.outputs.head }}
        SETUP: ${{ inputs.default-setup == 'true' && format('{0}/_setup.qd', github.action_path) || '' }}
      run: |
        while read -r f; do
          in=$f
          if [ -n "$SETUP" ]; then
            # 既定の設定を先頭に足した写しを、相対パスが変わらないよう同じフォルダに作る
            in="$(dirname "$f")/.seisho.$(basename "$f")"
            { cat "$SETUP"; echo; cat "$f"; } > "$in"
          fi
          # Quarkdown は出力名の記号 (全角のコロンや空白など) を - に置き換えるので、
          # 一時ディレクトリに固定の名前で出してから元の名前へ移す。
          # --pdf-no-sandbox は ubuntu ランナーでは AppArmor により Chrome の sandbox が使えないため
          tmp=$(mktemp -d)
          quarkdown c "$in" --pdf --strict --allow global-read --pdf-no-sandbox \
            --out "$tmp" --out-name document
          [ "$in" = "$f" ] || rm -f "$in"
          mkdir -p "$OUT/$(dirname "$f")"
          mv "$tmp/document.pdf" "$OUT/${f%.*}.pdf"
          rm -rf "$tmp"
        done < "$RUNNER_TEMP/seisho-modified.txt"
        while read -r f; do
          rm -f "$OUT/${f%.*}.pdf"
        done < "$RUNNER_TEMP/seisho-deleted.txt"
        [ -d "$OUT" ] && find "$OUT" -type d -empty -delete
        mkdir -p "$OUT"
        echo "$HEAD_SHA" > "$OUT/.seisho"
    - name: commit and push
      if: steps.list.outputs.changed == 'true'
      shell: bash
      env:
        OUT: ${{ steps.list.outputs.out }}
      run: |
        branch=$(git branch --show-current)
        if [ -z "$branch" ]; then
          echo "ブランチに乗っていないのでコミットできません。push か workflow_dispatch で呼んでください" >&2
          exit 1
        fi
        git add -A -- "$OUT"
        git diff --cached --quiet && exit 0
        # GITHUB_TOKEN で push したコミットは次のワークフローを起動しない
        git commit --quiet -m "PDF を更新する (seisho)"
        for i in 1 2 3; do
          git push --quiet origin "HEAD:refs/heads/$branch" && exit 0
          # 間に別の push があったら取り込み直す (PDF とソースは別の場所なのでぶつからない)
          git pull --quiet --rebase origin "$branch"
        done
        exit 1
    - name: upload with rclone
      if: steps.list.outputs.changed == 'true' && inputs.rclone-config != '' && inputs.rclone-remote != ''
      shell: bash
      env:
        OUT: ${{ steps.list.outputs.out }}
        RCLONE_CONF: ${{ inputs.rclone-config }}
        REMOTE: ${{ inputs.rclone-remote }}
      run: |
        command -v rclone > /dev/null || curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
        conf="$RUNNER_TEMP/seisho-rclone.conf"
        printf '%s\n' "$RCLONE_CONF" > "$conf"
        sed 's/\.qd$/.pdf/' "$RUNNER_TEMP/seisho-modified.txt" > "$RUNNER_TEMP/seisho-up.txt"
        sed 's/\.qd$/.pdf/' "$RUNNER_TEMP/seisho-deleted.txt" > "$RUNNER_TEMP/seisho-rm.txt"
        if [ -s "$RUNNER_TEMP/seisho-up.txt" ]; then
          rclone copy --config "$conf" --files-from-raw "$RUNNER_TEMP/seisho-up.txt" "$OUT" "$REMOTE"
        fi
        if [ -s "$RUNNER_TEMP/seisho-rm.txt" ]; then
          rclone delete --config "$conf" --files-from-raw "$RUNNER_TEMP/seisho-rm.txt" "$REMOTE" || true
        fi
        rm -f "$conf"
